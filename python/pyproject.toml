[build-system]
requires = ["setuptools>=68.0", "cffi>=1.16"]
build-backend = "setuptools.build_meta"

[project]
name = "tinywindow"
version = "0.1.0"
description = "Time-windowed probabilistic frequency counting"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = ["cffi>=1.16"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["tinywindow*"]

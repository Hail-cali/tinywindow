name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  c-core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build C core
        run: |
          cd core
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Run C tests
        run: |
          cd core/build
          ctest --output-on-failure

      - name: Run C benchmark
        run: |
          cd core/build
          ./bench_throughput

  kotlin:
    needs: c-core
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build and test Kotlin
        run: |
          cd kotlin
          ./gradlew test

  python:
    needs: c-core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build C core
        run: |
          cd core
          mkdir build && cd build
          cmake -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Install Python package
        run: |
          cd python
          pip install -e ".[dev]"

      - name: Run Python tests
        run: |
          cd python
          pytest tests/ -v
